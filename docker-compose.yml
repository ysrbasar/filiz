version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: filiz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: filiz
      POSTGRES_PASSWORD: filiz123
      POSTGRES_DB: filiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: filiz_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
